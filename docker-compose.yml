version: '3.8'

services:
  heft-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heft-workout-tracker
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
    labels:
      - "com.heft.description=Heft Workout Tracker Web App"
      - "com.heft.version=1.0.0"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
