name: workout_tracker
description: IronLog - Weightlifting Progress Tracker
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.2
  google_sign_in: ^6.2.2

  # Charts
  fl_chart: ^0.69.0

  # UI
  google_fonts: ^6.2.1

  # Utils
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.19.0
  vibration: ^2.0.0
  audioplayers: ^6.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Icons
  lucide_icons_flutter: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13
  riverpod_lint: ^2.6.1
  mockito: 5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
